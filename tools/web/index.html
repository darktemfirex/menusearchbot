<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴찾기 앱 설치</title>
<meta name="theme-color" content="#0066ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #f7f7f8; --card: #fff; --ink: #171719; --ink2: #37383c; --sub: #5a5c63; --line: #e1e2e4;
          --primary: #0066ff; --primary-dark: #0054d1; --tint: #eaf2fe; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg);
         color: var(--ink); font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px;
         box-shadow: 0 8px 16px rgba(23, 23, 23, .08), 0 2px 4px rgba(23, 23, 23, .06); text-align: center; }
  .logo { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 18px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.5px; }
  .lead { margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: var(--sub); word-break: keep-all; }
  button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-family: inherit;
           font-size: 17px; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: #a9c8ff; cursor: default; }
  #status { margin: 16px 0 0; min-height: 24px; font-size: 14px; line-height: 1.6; color: var(--ink2); word-break: keep-all; }
  #status.ok { color: #0a6b2d; font-weight: 700; }
  .steps { margin: 24px 0 0; padding: 16px; background: var(--tint); border-radius: 12px; text-align: left; font-size: 14px; line-height: 1.7; color: #0a2f73; }
  .steps b { display: block; margin-bottom: 2px; }
  .steps div + div { margin-top: 10px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
  </div>
  <h1>메뉴찾기</h1>
  <p class="lead">화면과 인터페이스의 위치를 메뉴 경로로 찾아 주는 앱입니다. 설치하면 홈 화면에서 바로 열 수 있습니다.</p>
  <button type="button" id="install">앱 설치</button>
  <p id="status" role="status"></p>
  <div class="steps" id="steps">
    <div><b>Android · PC (Chrome, Edge)</b>위의 「앱 설치」 버튼을 누르고 설치 창에서 「설치」를 선택합니다.</div>
    <div><b>iPhone (Safari)</b>화면 아래의 공유 버튼을 누른 뒤 「홈 화면에 추가」를 선택합니다.</div>
  </div>
</main>
<script>
const btn = document.getElementById("install");
const statusEl = document.getElementById("status");
const steps = document.getElementById("steps");
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ua = navigator.userAgent;
const ios = /iphone|ipad|ipod/i.test(ua);
const iosSafari = ios && !/crios|fxios|edgios/i.test(ua);
let installEvent = null;

function say(text, ok) { statusEl.textContent = text; statusEl.className = ok ? "ok" : ""; }

if (standalone) {                       // 이미 앱으로 열었다면 설치 화면 대신 앱 화면으로 보낸다
  location.replace("app.html");
} else {
  window.addEventListener("beforeinstallprompt", (ev) => {   // Chrome·Edge·Android: 설치 창을 직접 띄울 수 있다
    ev.preventDefault(); installEvent = ev;
  });
  window.addEventListener("appinstalled", () => {
    btn.hidden = true; steps.hidden = true;
    say("설치되었습니다. 홈 화면(PC는 시작 메뉴)의 「메뉴찾기」를 열어 주세요.", true);
  });
  btn.addEventListener("click", async () => {
    if (installEvent) {
      installEvent.prompt();
      const choice = await installEvent.userChoice.catch(() => null);
      installEvent = null;
      if (choice && choice.outcome === "dismissed") say("설치를 취소했습니다. 다시 설치하려면 버튼을 눌러 주세요.");
    } else if (ios) {
      say(iosSafari ? "화면 아래의 공유 버튼을 누른 뒤 「홈 화면에 추가」를 선택해 주세요."
                    : "iPhone에서는 Safari에서만 설치할 수 있습니다. 이 주소를 Safari로 열어 주세요.");
    } else {
      say("설치 창을 열 수 없습니다. 브라우저 주소창의 설치 아이콘 또는 메뉴의 「앱 설치」를 이용해 주세요. 이미 설치했다면 홈 화면에서 열어 주세요.");
    }
  });
}

if ("serviceWorker" in navigator) {   // 설치 조건: HTTPS 또는 localhost 에서 서비스 워커가 등록돼야 한다
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
