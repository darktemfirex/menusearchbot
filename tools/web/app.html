<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴찾기</title>
<meta name="theme-color" content="#0066ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --ink: #171719; --ink2: #37383c; --sub: #5a5c63; --cap: #70737c;
    --line: #e1e2e4; --line-strong: #c9cbd0;
    --primary: #0066ff; --primary-dark: #0054d1; --primary-tint: #eaf2fe;
    --chip: #f0f1f3; --warn-bg: #fff4e5; --warn-line: #ff9200; --warn-ink: #5c3300;
    --err-bg: #fff0f0; --err-ink: #8a1f1f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  button, input { font-family: inherit; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 32px; min-height: 64px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
  .title { display: flex; flex-direction: column; gap: 2px; }
  .title b { font-size: 18px; letter-spacing: -0.4px; }
  .title span { font-size: 12px; color: var(--sub); }
  .spacer { flex-grow: 1; }
  .count { font-size: 13px; color: var(--sub); background: var(--chip); padding: 6px 12px; border-radius: 999px; }

  #chat { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 32px 24px 24px;
          display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; scroll-margin-bottom: 190px; }  /* 자동 스크롤 때 아래 입력창에 가리지 않게 */
  .row.me { justify-content: flex-end; }
  .row.bot { flex-direction: column; gap: 10px; max-width: 640px; }
  .bubble { padding: 12px 16px; font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-break: keep-all; }
  .me .bubble { background: var(--primary); color: #fff; border-radius: 16px 16px 4px 16px; max-width: 70%; }
  .bot .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; }

  .sticker { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
             display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(23, 23, 23, .06); }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { background: var(--primary-tint); color: var(--primary-dark); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .badge.if { background: var(--chip); color: var(--ink2); }
  .sid { font-size: 13px; font-weight: 500; color: var(--sub); }
  .copy { display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line);
          border-radius: 8px; background: #fff; color: var(--ink2); font-size: 13px; font-weight: 500; cursor: pointer; }
  .copy:hover { border-color: var(--primary); color: var(--primary-dark); }
  .crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; color: var(--sub); }
  .crumbs .last { color: var(--ink); font-weight: 700; }
  .crumbs svg { flex-shrink: 0; }
  .detail { font-size: 14px; line-height: 1.6; color: var(--sub); }

  .withheld { max-width: 640px; background: var(--warn-bg); border: 1px dashed var(--warn-line); border-radius: 12px;
              padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
  .withheld b { font-size: 16px; color: var(--warn-ink); }
  .withheld p { margin: 4px 0 0; font-size: 14px; line-height: 1.6; color: var(--warn-ink); }
  .error { max-width: 640px; background: var(--err-bg); border: 1px dashed #ff4242; color: var(--err-ink); border-radius: 12px; padding: 12px 16px; }

  .loading .bubble { display: flex; gap: 6px; padding: 16px; }
  .loading span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: dot 1s infinite ease-in-out; }
  .loading span:nth-child(2) { animation-delay: .15s; }
  .loading span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }

  footer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 16px 24px 20px; }
  .dock { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 12px;
                     font-size: 16px; background: #fff; color: var(--ink); }
  input[type=text]:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }
  #send { height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--primary); color: #fff;
          font-size: 16px; font-weight: 700; cursor: pointer; }
  #send:hover { background: var(--primary-dark); }
  #send:disabled { background: #a9c8ff; cursor: default; }
  .note { text-align: center; font-size: 12px; color: var(--cap); }
  .pages-note { max-width: 800px; width: 100%; margin: 16px auto 0; padding: 12px 16px; background: var(--primary-tint);
                color: #0a2f73; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .pages-note a { color: var(--primary-dark); font-weight: 700; }
  .mode { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px;
          background: #fff; color: var(--ink2); font-size: 13px; font-weight: 500; cursor: pointer; }
  .mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--cap); }
  .mode.ai { border-color: #7fd29a; color: #0a6b2d; } .mode.ai i { background: #1fa04a; }
  .mode.browser i { background: #8a8d94; }
  .mode.plain { color: var(--sub); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 560px) { header { padding: 10px 16px; } #chat { padding: 20px 16px; } .me .bubble { max-width: 85%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
    </div>
    <div class="title"><b>메뉴찾기</b><span>사내 시스템</span></div>
    <div class="spacer"></div>
    <button type="button" id="mode" class="mode" title="누르면 AI 서버를 다시 찾습니다"><i></i><span>서버 확인 중…</span></button>
    <span class="count">등록 화면 307 · 인터페이스 317</span>  </header>
  <div id="hint" class="pages-note" hidden></div>
  <div id="chat"></div>
  <footer>
    <div class="dock">
      <form id="form" autocomplete="off">
        <label for="input" class="sr">찾는 화면이나 업무</label>
        <input type="text" id="input" placeholder="찾는 화면이나 업무를 입력하세요" maxlength="500">
        <button type="submit" id="send">보내기</button>
      </form>
      <div class="note">등록된 메뉴·인터페이스 목록 기준 안내입니다. 실제 화면 위치와 다르면 담당자에게 확인해 주세요.</div>
    </div>
  </footer>
</div>
<script src="search.js"></script>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];   // [{question, result}] — 탭을 닫으면 사라진다
let busy = false;
const NS = "http://www.w3.org/2000/svg";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // 글은 항상 textContent 로(HTML로 해석하지 않음)
  return e;
}
function icon(paths, size, stroke) {
  const s = document.createElementNS(NS, "svg");
  for (const [k, v] of Object.entries({ width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: stroke || "currentColor",
    "stroke-width": "1.8", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  for (const d of paths) { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); s.appendChild(p); }
  return s;
}
function add(node) { chat.appendChild(node); node.scrollIntoView({ block: "end", behavior: "smooth" }); return node; }

function userBubble(text) {
  const row = el("div", "row me"); row.appendChild(el("div", "bubble", text)); add(row);
}
function loadingBubble() {
  const row = el("div", "row bot loading");
  const b = el("div", "bubble");
  for (let i = 0; i < 3; i++) b.appendChild(el("span"));
  row.appendChild(b); return add(row);
}
function errorBubble(text) {
  const row = el("div", "row"); row.appendChild(el("div", "error", text)); add(row);
}

function copyButton(text) {
  const b = el("button", "copy"); b.type = "button";
  b.appendChild(icon(["M9 9h11v11H9z", "M5 15V6a2 2 0 0 1 2-2h8"], 16));
  const label = el("span", null, "경로 복사"); b.appendChild(label);
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); label.textContent = "복사됨"; }
    catch (e) { label.textContent = "복사 실패"; }
    setTimeout(() => { label.textContent = "경로 복사"; }, 1500);
  });
  return b;
}

function sourceCard(s) {           // 출처는 서버(코드)가 붙여서 보낸 그대로 보여 준다
  const card = el("div", "sticker");
  const meta = el("div", "meta");
  meta.appendChild(el("span", s.kind === "interface" ? "badge if" : "badge", s.kind === "interface" ? "인터페이스" : "화면"));
  meta.appendChild(el("span", "sid", s.id));
  meta.appendChild(el("div", "spacer"));
  if (s.kind === "interface") {
    meta.appendChild(copyButton(`${s.name} (${s.id})`));
    card.appendChild(meta);
    card.appendChild(el("div", "crumbs last", s.name));
    card.appendChild(el("div", "detail", s.detail));   // 대상 시스템 · 연계방식 · 주기
  } else {
    meta.appendChild(copyButton(`${s.detail} > ${s.name}`));
    card.appendChild(meta);
    const crumbs = el("div", "crumbs");
    for (const part of s.detail.split(" > ")) {
      crumbs.appendChild(el("span", null, part));
      crumbs.appendChild(icon(["M9 6l6 6-6 6"], 14, "#70737c"));
    }
    crumbs.appendChild(el("span", "last", s.name));
    card.appendChild(crumbs);
  }
  return card;
}

function resultBubble(r) {
  if (r.kind === "withheld") {
    const card = el("div", "withheld");
    card.appendChild(icon(["M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", "M12 8v5", "M12 16.5v.01"], 22, "#8a4b00"));
    const body = el("div");
    body.appendChild(el("b", null, "답변 보류"));
    body.appendChild(el("p", null, "등록된 화면·인터페이스 목록에서 찾지 못했습니다. 화면 이름을 바꿔서 다시 입력해 주세요."));
    card.appendChild(body);
    const row = el("div", "row"); row.appendChild(card); add(row);
    return;
  }
  const row = el("div", "row bot");
  row.appendChild(el("div", "bubble", r.text.replace(/\*\*/g, "")));   // 답 속 굵은 표시(**)는 글자만 남긴다
  for (const s of r.sources) row.appendChild(sourceCard(s));
  add(row);
}

let rowsCache = null;
async function loadRows() {        // 브라우저 검색 모드용 목록(data.json)
  if (!rowsCache) { const r = await fetch("data.json"); if (!r.ok) throw new Error("data"); rowsCache = await r.json(); }
  return rowsCache;
}

// ── 실행 환경 감지: AI 서버(같은 주소 → 저장한 주소 → 내 PC 127.0.0.1:8765)를 찾고, 없으면 브라우저 검색 모드 ──
const LOCAL = "http://127.0.0.1:8765";
const DEFAULT_SERVER = "https://desktop-206hsh9.tail12f4e6.ts.net";   // 휴대폰용 고정 서버(Tailscale Funnel)
const ERR = "잠시 후 다시 시도해 주세요";
const modeBtn = document.getElementById("mode");
const hint = document.getElementById("hint");
let apiBase = null;                 // null 이면 브라우저 검색 모드

function setMode(m, base) {
  modeBtn.className = "mode " + (m === "checking" ? "" : m);
  modeBtn.lastChild.textContent = m === "ai" ? "AI 서버 연결됨" : m === "browser" ? "브라우저 검색 모드" : "서버 확인 중…";
  modeBtn.title = m === "ai" ? base : "누르면 AI 서버를 다시 찾습니다";
  hint.hidden = m !== "browser";
  if (m === "browser") {
    hint.textContent = "AI 서버를 찾지 못해 이름·경로·ID 검색으로 동작합니다. 서버 PC가 켜져 있는지 확인한 뒤 위의 상태 표시를 눌러 다시 찾아 주세요. ";
    if (location.hostname.endsWith("github.io")) {
      const a = el("a", null, "서버 프로그램 내려받기"); a.href = "menusearchbot.zip"; a.setAttribute("download", "");
      hint.appendChild(a);
    }
  }
}
async function alive(base) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), base === LOCAL ? 1500 : 5000);   // 터널은 첫 응답이 느릴 수 있다
  try {
    const r = await fetch(base + "/api/health", { signal: c.signal, cache: "no-store" });
    return r.ok && (await r.json()).ok === true;
  } catch (e) { return false; } finally { clearTimeout(t); }
}
async function detect() {
  setMode("checking");
  const bases = [];
  if (!location.hostname.endsWith("github.io") && location.protocol.startsWith("http")) bases.push(".");
  bases.push(LOCAL, DEFAULT_SERVER);   // 서버 PC 자신은 로컬이 빠르고, 휴대폰은 로컬이 바로 실패해 고정 서버로 넘어간다
  for (const b of bases) if (await alive(b)) { apiBase = b; setMode("ai", b); return; }
  apiBase = null; setMode("browser");
}
modeBtn.addEventListener("click", detect);
window.addEventListener("focus", () => { if (!apiBase && !busy) detect(); });   // 서버를 켠 뒤 앱으로 돌아오면 다시 찾는다
detect();
loadRows().catch(() => {});         // 서버가 꺼져도 바로 검색할 수 있게 목록을 미리 받아 둔다(약 88KB)

async function ask(q) {
  q = q.trim();
  if (!q) return;                // 빈 입력·공백만 입력은 보내지 않는다
  if (busy) return;
  busy = true; send.disabled = true; input.value = "";
  userBubble(q);
  const wait = loadingBubble();
  let result = null, errMsg = null;
  try {
    if (apiBase) {
      try {
        const res = await fetch(apiBase + "/api/ask", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, history: history.slice(-3) }),
        });
        if (res.status === 404 || res.status === 405) throw new Error("no server");
        const data = await res.json();
        if (res.ok) result = data; else errMsg = data.error || ERR;
      } catch (e) {                 // 서버가 꺼졌거나 닿지 않는다: 브라우저 검색으로 넘어간다
        apiBase = null; setMode("browser");
      }
    }
    if (!result && !errMsg) {
      try { result = MenuSearch.search(q, await loadRows()); } catch (e) { errMsg = ERR; }
    }
    wait.remove();
    if (errMsg) errorBubble(errMsg);
    else { resultBubble(result); history.push({ question: q, result }); }
  } catch (e) {
    wait.remove(); errorBubble(ERR);
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

if ("serviceWorker" in navigator) {   // 설치형 웹앱(PWA): HTTPS 또는 localhost 에서만 등록된다
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

form.addEventListener("submit", (ev) => { ev.preventDefault(); ask(input.value); });
</script>
</body>
</html>
