name: GitHub Pages

# tools/web(화면 파일)만 Pages 로 올린다. 검색 서버(tools/server.py)와 데이터(data/, store/)는 올라가지 않는다.
on:
  push:
    branches: [main]
    paths: ["tools/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/web
      - id: deployment
        uses: actions/deploy-pages@v4
