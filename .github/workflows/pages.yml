name: GitHub Pages

# Pages 에 올라가는 것: 화면(tools/web) + 내려받기용 패키지 menusearchbot.zip
# 서버를 켜는 곳이 아니므로 Pages 화면은 브라우저 검색 모드로 동작하고, AI 답변은 내려받은 앱에서 쓴다.
on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - "store/**"
      - "run.sh"
      - "run.bat"
      - "README.md"
      - "Dockerfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and download package
        run: |
          mkdir -p _site
          cp -r tools/web/. _site/
          # .env(키)·.git·테스트는 넣지 않는다. 실행에 필요한 것만 묶는다.
          mkdir -p _pkg/menusearchbot
          cp -r tools data store run.sh run.bat README.md spec.md Dockerfile _pkg/menusearchbot/
          find _pkg -name "__pycache__" -type d -prune -exec rm -rf {} +
          (cd _pkg && zip -qr ../_site/menusearchbot.zip menusearchbot)
          ls -la _site/menusearchbot.zip

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
